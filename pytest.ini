[pytest]
# 测试根目录
testpaths = tests

# 让 pytest-qt 使用 PyQt6（不写的话它按插件可用性自动挑，多 Qt 绑定的机器上会挑错）
qt_api = pyqt6

# 本机跑完整套件（214 条：187 无头 + 27 图形界面，约 3.5 分钟，需要真实交互桌面）：
#   pytest
# CI 只跑其中 178 条不依赖 Qt 的用例，见 .github/workflows/build.yml 的 test 作业。
#
# 坑 1：tests/test_gui.py 与 tests/test_sync_chain.py 会创建 QApplication，需要真实交互
#       桌面；offscreen 与 minimal 两种平台插件实测都会挂起。
# 坑 2：同一时间只跑一份 —— 残留的挂起运行会与后续运行抢 Qt，表现为随机卡死。
