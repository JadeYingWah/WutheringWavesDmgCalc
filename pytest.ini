[pytest]
# 测试根目录
testpaths = tests

# 让 pytest-qt 使用 PyQt6（不写的话它按插件可用性自动挑，多 Qt 绑定的机器上会挑错）
qt_api = pyqt6

# 基线（本机干净环境实测）：214 passed / exit 0 / 约 3.5 分钟。
#
# 坑 1：不要设 QT_QPA_PLATFORM=offscreen —— 实测套件会在 GUI 段挂起。
#       tests/test_gui.py 需要真实窗口，Windows 下默认平台插件即可。
# 坑 2：不要只挑"无头用例"子集跑 —— 实测只跑那 4 个文件会在收尾处挂起，
#       完整套件反而能正常结束。
# 坑 3：同一时间只跑一份 —— 残留的挂起运行会与后续运行抢 Qt，表现为随机卡死。
