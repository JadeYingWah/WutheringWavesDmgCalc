name: CI（测试 + 打包发布）
run-name: ${{ github.event_name == 'workflow_dispatch' && '自动打包发布' || '测试' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v1.1）'
        required: true
        type: string
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  # 测试门禁：每次 push / PR 都跑。
  # 范围与原因（实测，改动前请先读）：
  #   - 只跑下面这 3 个不依赖 Qt 的文件：178 条，实测 0.11 秒，offscreen 下稳定。
  #   - tests/test_gui.py(27) 与 tests/test_sync_chain.py(9) 会创建 QApplication，
  #     需要真实交互桌面；无桌面的 runner 上会挂起（offscreen 与 minimal 实测同样挂起），
  #     因此不进 CI —— 请在本机跑完整套件：`pytest`（214 条，约 3.5 分钟，需真实桌面）。
  #   - 完整套件本机基线（干净环境）：214 passed / exit 0。
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      - name: 下载 OCR 模型
        run: |
          if (-not (Test-Path "models")) { New-Item -ItemType Directory -Path "models" -Force | Out-Null }
          if (-not (Test-Path "models/ch_PP-OCRv5_mobile_det.onnx")) {
            curl.exe -L -o "models/ch_PP-OCRv5_mobile_det.onnx" "https://github.com/RapidOCR/RapidOCR/releases/download/v1.0/ch_PP-OCRv5_mobile_det.onnx" -H "Accept: application/octet-stream" -A "WWDmgCalc-CI/1.0"
          }
          if (-not (Test-Path "models/ch_PP-OCRv5_rec_server_infer.onnx")) {
            curl.exe -L -o "models/ch_PP-OCRv5_rec_server_infer.onnx" "https://github.com/RapidOCR/RapidOCR/releases/download/v1.0/ch_PP-OCRv5_rec_server_infer.onnx" -H "Accept: application/octet-stream" -A "WWDmgCalc-CI/1.0"
          }

      - name: 运行测试（178 条，不依赖 Qt）
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/test_damage_formula.py tests/test_data_flow.py tests/test_save_format.py -q

  build:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: |
          pip install pyinstaller
          pip install PyQt6 opencv-python onnxruntime numpy pillow shapely pyclipper pyyaml six matplotlib psutil rapidocr-onnxruntime

      - name: 下载 OCR 模型
        run: |
          if (-not (Test-Path "models")) { New-Item -ItemType Directory -Path "models" -Force | Out-Null }
          if (-not (Test-Path "models/ch_PP-OCRv5_mobile_det.onnx")) {
            Write-Host "下载检测模型..."
            curl.exe -L -o "models/ch_PP-OCRv5_mobile_det.onnx" "https://github.com/RapidOCR/RapidOCR/releases/download/v1.0/ch_PP-OCRv5_mobile_det.onnx" -H "Accept: application/octet-stream" -A "WWDmgCalc-CI/1.0"
          }
          if (-not (Test-Path "models/ch_PP-OCRv5_rec_server_infer.onnx")) {
            Write-Host "下载识别模型..."
            curl.exe -L -o "models/ch_PP-OCRv5_rec_server_infer.onnx" "https://github.com/RapidOCR/RapidOCR/releases/download/v1.0/ch_PP-OCRv5_rec_server_infer.onnx" -H "Accept: application/octet-stream" -A "WWDmgCalc-CI/1.0"
          }
          Write-Host "模型就绪"
          Get-ChildItem models | Select-Object Name, Length

      - name: 打包主程序 + ErrorViewer
        run: |
          cd packaging
          python -m PyInstaller WWDmgCalc.spec --distpath ../dist --workpath ../build/WWDmgCalc_build --clean

      - name: 打包 Git 代理管理
        run: |
          cd packaging
          python -m PyInstaller git_proxy_manager.spec --distpath dist_tools --workpath build_tools --clean

      - name: 打包预设上传工具
        run: |
          cd packaging
          python -m PyInstaller preset_uploader.spec --distpath dist_tools --workpath build_tools --clean

      - name: 重组目录结构
        run: |
          cd packaging
          python after_build.py

      - name: 验证打包产物
        run: |
          Write-Host "=== dist/WutheringWavesDmgCalc/ 结构 ==="
          Get-ChildItem dist/WutheringWavesDmgCalc -Recurse -Depth 2 | Select-Object FullName
          if (-not (Test-Path "dist/WutheringWavesDmgCalc/WWDmgCalc/WWDmgCalc.exe")) {
            Write-Host "ERROR: 主程序 exe 不存在！"
            exit 1
          }
          Write-Host "`n✅ 打包验证通过"

      - name: 压缩为 zip
        run: |
          cd dist
          Compress-Archive -Path WutheringWavesDmgCalc -DestinationPath "..\WutheringWavesDmgCalc.zip" -Force
          cd ..
          $sizeMB = [math]::Round((Get-Item "WutheringWavesDmgCalc.zip").Length / 1MB, 0)
          Write-Host "Zip: WutheringWavesDmgCalc.zip  ($sizeMB MB)"

      - name: 上传构建产物 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: WutheringWavesDmgCalc-${{ github.sha }}
          path: WutheringWavesDmgCalc.zip

      - name: 创建 Release 并上传（仅手动触发）
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: "鸣潮伤害计算器 ${{ github.event.inputs.version }}"
          body: |
            ## 鸣潮伤害计算器 ${{ github.event.inputs.version }}

            下载后解压，运行 `WutheringWavesDmgCalc/WWDmgCalc.exe` 即可使用。

            > 本 Release 由 GitHub Actions 自动打包生成。
          files: WutheringWavesDmgCalc.zip
          generate_release_notes: false
